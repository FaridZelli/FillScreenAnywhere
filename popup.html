<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    background: #1c1c1e;
    color: #f2f2f2;
    font: 14px/1.4 "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .popup-content {
    width: 100%;
    min-width: 300px;
    max-width: 440px;
  }
  h1 {
    font-size: 1.5em;
    margin: 0 0 0.4em;
    font-weight: 600;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 0.75em;
  }
  .seg {
    display: flex;
    background: #2c2c2e;
    border-radius: 8px;
    margin-bottom: 1em;
  }
  .seg button {
    flex: 1;
    padding: 0.5em 0;
    border: 0;
    background: transparent;
    color: #9a9a9e;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.92em;
    font-weight: 500;
    transition: background-color 0.3s ease, color 0.3s ease;
  }
  .seg button.active {
    background: #ff5500;
    color: #fff;
  }
  textarea {
    width: 100%;
    min-height: 8.5em;
    resize: none;
    background: #2c2c2e;
    color: #f2f2f2;
    border: 1px solid #3a3a3c;
    border-radius: 8px;
    padding: 0.65em;
    font: 0.92em/1.4 monospace;
    transition: border-color 0.3s ease;
  }
  textarea:focus {
    border-color: #ffffff;
    outline: none;
    box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.15);
  }
  .hint {
    color: #8e8e93;
    font-size: 0.85em;
    margin: 1em 0 1em;
  }
  hr {
    border: 0;
    border-top: 1px solid #2c2c2e;
    margin: 1em 0;
  }
  .switch {
    position: relative;
    display: inline-block;
    width: 36px;
    height: 21px;
    flex-shrink: 0;
    cursor: pointer;
  }
  .switch input {
    position: absolute;
    opacity: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    cursor: pointer;
  }
  .slider {
    position: absolute;
    inset: 0;
    background: #3a3a3c;
    border-radius: 999px;
    transition: .2s;
    pointer-events: none;
  }
  .slider::before {
    content: "";
    position: absolute;
    width: 17px;
    height: 17px;
    left: 2px;
    top: 2px;
    background: #fff;
    border-radius: 50%;
    transition: .2s;
  }
  input:checked + .slider { background: #ff5500; }
  input:checked + .slider::before { transform: translateX(15px); }
  .restore-btn {
    width: 100%;
    padding: 0.65em 0;
    background: #2c2c2e;
    color: #ff5500;
    border: 1px solid #3a3a3c;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.92em;
    font-weight: 600;
    transition: background-color 0.3s ease, border-color 0.3s ease;
  }
  @media (hover: hover) {
    .restore-btn:hover {
      background: #3a3a3c;
      border-color: #4a4a4c;
    }
  }
  .restore-btn:active {
    background: #3a3a3c;
    border-color: #4a4a4c;
  }

  html.is-mobile body {
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
             max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
    font-size: 16px;
  }
  html.is-mobile .popup-content {
    width: 100%;
    max-width: 420px;
  }
  html.is-mobile .switch {
    width: 46px;
    height: 26px;
  }
  html.is-mobile .slider::before {
    width: 22px;
    height: 22px;
  }
  html.is-mobile input:checked + .slider::before {
    transform: translateX(20px);
  }

  html.is-mobile h1 {
    display: none;
  }

  html.is-mobile .mobile-hide {
    display: none;
  }

   html.is-desktop .desktop-hide {
    display: none;
  }

  .github-link {
    display: inline-block;
    margin: 0 0 1em;
    font-size: 1em;
    text-decoration: none;
  }

  .github-link,
  .github-link:visited,
  .github-link:active {
    color: cyan;
    text-decoration: none;
  }

  .app-icon {
  width: 3em;
  height: 3em;
  margin-bottom: 1em;
  display: block;
  }
</style>
</head>
<body>
  <div class="popup-content">
    <img src="fillscreenanywhere.svg" alt="" class="app-icon">
    <h1>Fill Screen Anywhere</h1>
    <a href="https://github.com/FaridZelli/FillScreenAnywhere" target="_blank" class="github-link">Star on GitHub</a>
    <div class="seg">
      <button id="modeDeny" class="active">Deny list</button>
      <button id="modeAllow">Allow list</button>
    </div>
    <textarea id="denyList" placeholder="example.com"></textarea>
    <textarea id="allowList" placeholder="example.com" style="display:none"></textarea>
    <div class="hint" id="listHint">Runs on every website except these.</div>
    <hr>
    <div class="row">
      <label for="centerVideos">Center all videos</label>
      <div class="switch"><input type="checkbox" id="centerVideos" checked><span class="slider"></span></div>
    </div>
    <div class="row">
      <label for="pinchGestures">Enable pinch gestures</label>
      <div class="switch"><input type="checkbox" id="pinchGestures" checked><span class="slider"></span></div>
    </div>
    <div class="row">
      <label for="toggleButtons">
        <span class="mobile-hide">Show on-screen buttons</span>
        <span class="desktop-hide">Hide on-screen buttons</span>
      </label>
      <div class="switch"><input type="checkbox" id="toggleButtons" checked><span class="slider"></span></div>
    </div>
    <div class="row desktop-hide">
      <label for="overrideYouTube">Enable YouTube overrides</label>
      <div class="switch"><input type="checkbox" id="overrideYouTube" checked><span class="slider"></span></div>
    </div>
    <div class="row">
      <label for="capTaller">Limit crop on 3:2 or taller videos</label>
      <div class="switch"><input type="checkbox" id="capTaller" checked><span class="slider"></span></div>
    </div>
    <div class="row">
      <label for="capWider">Limit crop on 2:1 or wider videos</label>
      <div class="switch"><input type="checkbox" id="capWider" checked><span class="slider"></span></div>
    </div>
    <hr>
    <button id="restoreDefaults" class="restore-btn">Restore Defaults</button>
    <div class="hint desktop-hide">Hint:<br>You can long-press the full-screen button on YouTube to fill the screen when overrides are enabled.</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
